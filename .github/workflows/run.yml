name: Gold Trading Bot

on:
  # ใช้ workflow_dispatch อย่างเดียว — cron-job.org ("Gold bot Trigger") เป็นตัวยิงเข้ามาทุก 5 นาที
  # ผ่าน GitHub API endpoint นี้ (เพราะงั้นในหน้า Actions ถึงขึ้นว่า "Manually run by ..." ทุกรอบ
  # ทั้งที่รันอัตโนมัติจริง — เป็นพฤติกรรมปกติของ GitHub ไม่ใช่บั๊ก)
  #
  # ตั้งใจ "ไม่ใช้" schedule: ของ GitHub เอง เพราะทดสอบจริงแล้วพบว่าไม่น่าเชื่อถือสำหรับงานที่ต้องรัน
  # ถี่ระดับ 5 นาที — เงียบหายไปเกิน 20 นาทีไม่รันเลยก็มี (GitHub ระบุเองในเอกสารว่าอาจ drop รอบ
  # ทิ้งได้ถ้าระบบโหลดสูง) ขณะที่ cron-job.org ตรงเวลาระดับวินาที (jitter 10-25 วินาที)
  #
  # ⚠️ ห้ามเพิ่ม schedule: กลับเข้ามาคู่กับ cron-job.org เด็ดขาด — จะรันซ้อน 2 ทาง ทำให้แจ้งเตือน
  # Telegram ซ้ำ, เขียน kvdb ชนกัน และเปลือง Claude API ฟรีๆ ถ้าจะเปลี่ยนไปใช้ schedule: ของ GitHub
  # ต้องปิด "Gold bot Trigger" ใน cron-job.org ก่อนเสมอ (เลือกทางใดทางหนึ่งเท่านั้น)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
          KVDB_BUCKET: ${{ secrets.KVDB_BUCKET }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          # --- 2 ตัวนี้คือตัวที่หายไป ทำให้บันทึกออเดอร์ลง kvdb ไม่สำเร็จทุกครั้ง (เห็นใน log:
          # "[kvstore] ยังไม่ได้ตั้งค่า UPSTASH_REDIS_REST_URL/TOKEN ครบ") ส่งผลให้ AI Layer หา Event
          # ไม่เจอ -> ไม่เรียก AI -> ไม่เขียน Google Sheets -> ไม่มีข้อความ AI เข้า Telegram ---
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          # --- Central AI Layer (ai_layer.py) ---
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          # --- Google Sheets Logging (sheets_log.py) ---
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
